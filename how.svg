<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 830 1274" width="830" height="1274" role="img" aria-labelledby="t d"><title id="t">How LCW's status line is built</title><desc id="d">How LCW&#x27;s status line is built. Inside Claude Code, the mod redraws the card only when something changed and checks the usage mark itself after a tool call, so no process starts; the check at each prompt and the gate before each agent launch stay command hooks. Every second Claude Code runs the status line command with the session&#x27;s figures. The player, a POSIX shell script, prints the frame saved for this second when the input is the same and nothing LCW watches is newer. Otherwise the launcher, in Node, makes the same checks by comparing text and prints the saved frame if nothing really changed; else it loads LCW&#x27;s code and the draw draws this second and the next 15 and saves them, reading each file once. Saved frames are kept for each session. When the code cannot load or the draw fails, the last rows are printed again, the command ends well and one line goes to the log; a session with no rows yet prints &quot;LCW · status line could not load · see ~/.lcw/statusline.log&quot;.</desc><style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans",Helvetica,Arial,sans-serif}.m{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;font-size:12px}.h1{font-size:20px;font-weight:700;letter-spacing:-0.01em}.t{font-size:14px;font-weight:650}.b{font-size:13.5px}.s{font-size:12.5px}.it{font-style:italic}.lab,.labf{font-size:12px}.tg{font-size:12px;font-weight:600}rect{stroke-width:1}.dash{stroke-dasharray:5 4;stroke-width:1.3}.ln,.fln{stroke-width:1.4;fill:none;stroke-linecap:round;stroke-linejoin:round}.fln{stroke-dasharray:5 4}.ahp,.ahfp{fill:none;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}.ic{fill:none;stroke-width:1;stroke-linejoin:round}.pg{fill:#fbf9f6}.ink{fill:#24211e}.mut{fill:#6b645c}.card{fill:#ffffff;stroke:#e1d9ce}.card2{fill:#f6f2ec;stroke:#e1d9ce}.cc{fill:#f3eee7;stroke:#e1d9ce}.sh{fill:#eaf4f6;stroke:#8cc3cd}.nd{fill:#fbefe9;stroke:#e3ad97}.fl{fill:#ffffff;stroke:#b8423b}.ln{stroke:#a69d91}.fln{stroke:#b8423b}.ahp{stroke:#a69d91}.ahfp{stroke:#b8423b}.lab{fill:#6b645c}.labf{fill:#b8423b}.tagb{fill:#ffffff;stroke:#e2cf9f}.tg{fill:#8a5a12}.ic{stroke:#6b645c}@media (prefers-color-scheme:dark){.pg{fill:#0d1117}.ink{fill:#e6edf3}.mut{fill:#9da7b1}.card{fill:#161b22;stroke:#30363d}.card2{fill:#12171e;stroke:#30363d}.cc{fill:#11161d;stroke:#2a3038}.sh{fill:#0e2228;stroke:#2f6b76}.nd{fill:#2a1912;stroke:#7a4630}.fl{fill:#161b22;stroke:#f0807a}.ln{stroke:#6e7681}.fln{stroke:#f0807a}.ahp{stroke:#6e7681}.ahfp{stroke:#f0807a}.lab{fill:#9da7b1}.labf{fill:#f0807a}.tagb{fill:#161b22;stroke:#6b5524}.tg{fill:#e6c173}.ic{stroke:#9da7b1}}</style><defs><marker id="ah" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path class="ahp" d="M2 1.5L8.6 5L2 8.5"/></marker><marker id="ahf" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path class="ahfp" d="M2 1.5L8.6 5L2 8.5"/></marker></defs><rect class="pg" width="830" height="1274" rx="12"/><text class="h1 ink" x="24" y="40">How the status line is built</text><text class="b mut" x="24" y="63">What starts what each second, and what moves between the parts.</text><rect class="cc" x="20.5" y="82.5" width="789" height="292" rx="12"/><text class="t mut" x="38" y="108">Claude Code</text><rect class="card" x="36.5" y="124.5" width="373" height="151" rx="9"/><text class="t ink" x="52" y="149">The mod</text><path class="ic" d="M52 158h5.5l3 3v8.5h-8.5z M57.5 158v3h3"/><text class="m mut" x="68" y="168" textLength="129.6">hooks/register.tsx</text><text class="s ink" x="52" y="191.5">Redraws the card above the prompt only when</text><text class="s ink" x="52" y="209">something changed: 5 steps a second while a turn</text><text class="s ink" x="52" y="226.5">or an agent works, once a second while it waits</text><text class="s ink" x="52" y="244">on you, still when paused or finished.</text><text class="s ink" x="52" y="261.5">Reads only the files that changed.</text><rect class="tagb" x="329.8" y="115" width="64.2" height="18" rx="9"/><text class="tg" x="361.9" y="128.2" text-anchor="middle">changed</text><rect class="card" x="420.5" y="124.5" width="373" height="151" rx="9"/><text class="t ink" x="436" y="149">After a tool call</text><text class="s ink" x="436" y="172.5">The mod checks the usage mark itself, so no process</text><text class="s ink" x="436" y="190">starts. The check at each prompt and the gate before</text><text class="s ink" x="436" y="207.5">each agent launch stay command hooks.</text><rect class="tagb" x="713.8" y="115" width="64.2" height="18" rx="9"/><text class="tg" x="745.9" y="128.2" text-anchor="middle">changed</text><rect class="card" x="232.5" y="294.5" width="299" height="59" rx="9"/><text class="t ink" x="248" y="319">Status line</text><text class="s ink" x="248" y="342.5">runs LCW&#x27;s command every second</text><rect class="sh" x="232.5" y="456.5" width="299" height="163" rx="9"/><text class="t ink" x="248" y="481">The player</text><path class="ic" d="M248 490h5.5l3 3v8.5h-8.5z M253.5 490v3h3"/><text class="m mut" x="264" y="500" textLength="180">scripts/bin/statusline.sh</text><text class="s mut it" x="248" y="519">a POSIX shell script, no Node</text><text class="s ink" x="248" y="542.5">Prints the frame saved for this second when</text><text class="s ink" x="248" y="560">the input is the same (figures no row shows</text><text class="s ink" x="248" y="577.5">are passed over) and nothing LCW watches is</text><text class="s ink" x="248" y="595">newer than the frames.</text><rect class="tagb" x="478.2" y="447" width="37.8" height="18" rx="9"/><text class="tg" x="497.1" y="460.2" text-anchor="middle">new</text><rect class="nd" x="232.5" y="684.5" width="299" height="127" rx="9"/><text class="t ink" x="248" y="709">The launcher</text><path class="ic" d="M248 718h5.5l3 3v8.5h-8.5z M253.5 718v3h3"/><text class="m mut" x="264" y="728" textLength="187.2">scripts/bin/statusline.mjs</text><text class="s mut it" x="248" y="747">Node</text><text class="s ink" x="248" y="770.5">Makes the same checks by comparing text: if</text><text class="s ink" x="248" y="788">nothing really changed it prints the saved frame</text><text class="s ink" x="248" y="805.5">and loads nothing more.</text><rect class="tagb" x="451.8" y="675" width="64.2" height="18" rx="9"/><text class="tg" x="483.9" y="688.2" text-anchor="middle">changed</text><rect class="nd" x="232.5" y="876.5" width="299" height="183" rx="9"/><text class="t ink" x="248" y="901">The draw</text><path class="ic" d="M248 910h5.5l3 3v8.5h-8.5z M253.5 910v3h3"/><text class="m mut" x="264" y="920" textLength="158.4">scripts/statusline.mjs</text><path class="ic" d="M248 929h5.5l3 3v8.5h-8.5z M253.5 929v3h3"/><text class="m mut" x="264" y="939" textLength="223.2">scripts/lib/store.mjs, diff.mjs</text><text class="s mut it" x="248" y="958">Node, LCW&#x27;s own code</text><text class="s ink" x="248" y="981.5">Draws this second and the next 15, and saves</text><text class="s ink" x="248" y="999">them. Reads each file once, writes nothing that</text><text class="s ink" x="248" y="1016.5">did not change, and reuses the branch, repo</text><text class="s ink" x="248" y="1034">and changed lines for up to 15 seconds.</text><rect class="tagb" x="451.8" y="867" width="64.2" height="18" rx="9"/><text class="tg" x="483.9" y="880.2" text-anchor="middle">changed</text><rect class="card2" x="24.5" y="456.5" width="127" height="603" rx="9"/><text class="t ink" x="40" y="481">LCW&#x27;s records</text><text class="s ink" x="40" y="504.5">the week&#x27;s usage,</text><text class="s ink" x="40" y="522">the session and</text><text class="s ink" x="40" y="539.5">its activity, the run</text><text class="s ink" x="40" y="557"></text><text class="s ink" x="40" y="574.5">written by the hooks,</text><text class="s ink" x="40" y="592">the mod and lcw</text><rect class="card" x="616.5" y="456.5" width="189" height="603" rx="9"/><text class="t ink" x="632" y="481">Saved frames</text><path class="ic" d="M632 492v8h11v-6.5h-5.5l-1.5-1.5z"/><text class="m mut" x="648" y="500" textLength="50.4">frames/</text><text class="s ink" x="632" y="523.5">kept for each session:</text><text class="s ink" x="632" y="541"></text><text class="s ink" x="632" y="558.5">16 frames, one for</text><text class="s ink" x="632" y="576">each second</text><text class="s ink" x="632" y="593.5"></text><text class="s ink" x="632" y="611">the rows printed last</text><text class="s ink" x="632" y="628.5"></text><text class="s ink" x="632" y="646">what the player</text><text class="s ink" x="632" y="663.5">checks them against</text><rect class="tagb" x="752.2" y="447" width="37.8" height="18" rx="9"/><text class="tg" x="771.1" y="460.2" text-anchor="middle">new</text><rect class="fl dash" x="232.5" y="1130.5" width="573" height="117" rx="9"/><text class="t ink" x="248" y="1155">When it fails</text><text class="s ink" x="248" y="1178.5">LCW&#x27;s code cannot load or the draw fails, or Node or the launcher is missing:</text><text class="s ink" x="248" y="1196">the session&#x27;s last rows are printed again, the command still ends well (exit 0)</text><text class="s ink" x="248" y="1213.5">and one line goes to the log. A session with no rows yet prints:</text><text class="m ink" x="248" y="1234.5" textLength="432">LCW · status line could not load · see ~/.lcw/statusline.log</text><rect class="tagb" x="752.2" y="1121" width="37.8" height="18" rx="9"/><text class="tg" x="771.1" y="1134.2" text-anchor="middle">new</text><path class="ln" d="M352 354 L352 454" marker-end="url(#ah)"/><path class="ln" d="M412 456 L412 356" marker-end="url(#ah)"/><text class="lab" x="344" y="402" text-anchor="end">the session&#x27;s figures</text><text class="lab" x="420" y="402" text-anchor="start">the rows</text><path class="ln" d="M352 620 L352 682" marker-end="url(#ah)"/><path class="ln" d="M412 684 L412 622" marker-end="url(#ah)"/><text class="lab" x="344" y="649" text-anchor="end">otherwise, the figures</text><text class="lab" x="420" y="649" text-anchor="start">the rows</text><path class="ln" d="M352 812 L352 874" marker-end="url(#ah)"/><path class="ln" d="M412 876 L412 814" marker-end="url(#ah)"/><text class="lab" x="344" y="833.5" text-anchor="end">something changed:</text><text class="lab" x="344" y="848.5" text-anchor="end">it loads LCW&#x27;s code</text><text class="lab" x="420" y="841" text-anchor="start">this second&#x27;s rows</text><path class="ln" d="M152 546 L230 546" marker-end="url(#ah)"/><text class="lab" x="192" y="538" text-anchor="middle">their times</text><path class="ln" d="M152 756 L230 756" marker-end="url(#ah)"/><text class="lab" x="192" y="733" text-anchor="middle">their text,</text><text class="lab" x="192" y="748" text-anchor="middle">if newer</text><path class="ln" d="M152 976 L230 976" marker-end="url(#ah)"/><text class="lab" x="192" y="953" text-anchor="middle">each file</text><text class="lab" x="192" y="968" text-anchor="middle">read once</text><path class="ln" d="M616 546 L534 546" marker-end="url(#ah)"/><text class="lab" x="574" y="523" text-anchor="middle">this second&#x27;s</text><text class="lab" x="574" y="538" text-anchor="middle">frame</text><path class="ln" d="M616 756 L534 756" marker-end="url(#ah)"/><text class="lab" x="574" y="733" text-anchor="middle">the saved</text><text class="lab" x="574" y="748" text-anchor="middle">frame</text><path class="ln" d="M532 976 L614 976" marker-end="url(#ah)"/><text class="lab" x="574" y="953" text-anchor="middle">16 frames,</text><text class="lab" x="574" y="968" text-anchor="middle">last rows</text><path class="fln" d="M382 1060 L382 1128" marker-end="url(#ahf)"/><text class="labf" x="390" y="1099" text-anchor="start">cannot load, or fails</text><path class="ln" d="M711 1060 L711 1128" marker-end="url(#ah)"/><text class="lab" x="719" y="1099" text-anchor="start">the last rows</text></svg>
