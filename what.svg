ct class="play" x="166" y="566.4" width="14" height="9.6" rx="1.5"/><rect class="play" x="191.2" y="566.4" width="14" height="9.6" rx="1.5"/><rect class="play" x="216.4" y="566.4" width="14" height="9.6" rx="1.5"/><rect class="play" x="241.6" y="566.4" width="14" height="9.6" rx="1.5"/><rect class="play" x="266.8" y="566.4" width="14" height="9.6" rx="1.5"/><rect class="play" x="292" y="566.4" width="14" height="9.6" rx="1.5"/><rect class="play" x="317.2" y="566.4" width="14" height="9.6" rx="1.5"/><rect class="play" x="342.4" y="566.4" width="14" height="9.6" rx="1.5"/><rect class="play" x="367.6" y="566.4" width="14" height="9.6" rx="1.5"/><rect class="play" x="392.8" y="566.4" width="14" height="9.6" rx="1.5"/><rect class="play" x="418" y="566.4" width="14" height="9.6" rx="1.5"/><rect class="node" x="443.2" y="464" width="14" height="112" rx="2"/><rect class="play" x="468.4" y="566.4" width="14" height="9.6" rx="1.5"/><rect class="play" x="493.6" y="566.4" width="14" height="9.6" rx="1.5"/><rect class="play" x="518.8" y="566.4" width="14" height="9.6" rx="1.5"/><rect class="play" x="544" y="566.4" width="14" height="9.6" rx="1.5"/><rect class="play" x="569.2" y="566.4" width="14" height="9.6" rx="1.5"/><rect class="play" x="594.4" y="566.4" width="14" height="9.6" rx="1.5"/><rect class="play" x="619.6" y="566.4" width="14" height="9.6" rx="1.5"/><rect class="play" x="644.8" y="566.4" width="14" height="9.6" rx="1.5"/><rect class="play" x="670" y="566.4" width="14" height="9.6" rx="1.5"/><rect class="play" x="695.2" y="566.4" width="14" height="9.6" rx="1.5"/><rect class="play" x="720.4" y="566.4" width="14" height="9.6" rx="1.5"/><rect class="play" x="745.6" y="566.4" width="14" height="9.6" rx="1.5"/><rect class="play" x="770.8" y="566.4" width="14" height="9.6" rx="1.5"/><path class="axis" d="M32 576.5H792.8"/><text class="s mut" x="47" y="596" text-anchor="middle">0 s</text><text class="s mut" x="173" y="596" text-anchor="middle">5 s</text><text class="s mut" x="299" y="596" text-anchor="middle">10 s</text><text class="s mut" x="425" y="596" text-anchor="middle">15 s</text><text class="s mut" x="551" y="596" text-anchor="middle">20 s</text><text class="s mut" x="677" y="596" text-anchor="middle">25 s</text><text class="b bold nodet" x="64" y="476">Node draws this second and the next 15</text><text class="s mut" x="64" y="494">about 140 ms</text><text class="s mut" x="467.2" y="476">and again when those run out</text><text class="b bold playt" x="65.2" y="536.4">the shell plays a saved frame: no Node</text><text class="s mut" x="65.2" y="554.4">about 12 ms each</text><text class="b ink" x="24" y="630">Idle, Node starts <tspan class="bold">about 4 times a minute</tspan>, where it started 60 times.</text><text class="b mut" x="24" y="654">It draws again sooner when something the rows show changed (the model, the context share,</text><text class="b mut" x="24" y="674">a turn starting or ending, the run moving on), or when the saved frames ran out.</text><text class="h2 ink" x="24" y="720">When LCW's code fails to load</text><g><rect class="tbg thl" x="23.5" y="740.5" width="519.6" height="84" rx="10" filter="url(#sh)"/><text class="m ttx" x="41" y="764.3" textLength="7.8" font-weight="700">&gt;</text><rect class="tmidf" x="56.6" y="752" width="7.8" height="16"/><path class="thls" fill="none" stroke-width="1.1" d="M41 780H524.6"/><text class="m ttx" x="56.6" y="804.3" textLength="468">LCW · status line could not load · see ~/.lcw/statusline.log</text></g><text class="b bold ink" x="568.6" y="762">The rows stay.</text><text class="s mut" x="568.6" y="782">Nothing goes blank: one line</text><text class="s mut" x="568.6" y="799">goes to the log. A session with</text><text class="s mut" x="568.6" y="816">no rows drawn yet shows this</text><text class="s mut" x="568.6" y="833">line instead.</text></svg>
