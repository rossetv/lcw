<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 830 854" width="830" height="854" role="img" aria-labelledby="t"><title id="t">LCW&#x27;s status line: two rows and a mascot under the prompt that refresh every second and look as before. In thirty seconds of ticks, Node draws twice, each time this second and the next 15; on the other 28 ticks a shell script prints a saved frame and Node does not start. When LCW&#x27;s code fails to load, the rows on screen stay; a session with none yet shows &quot;LCW · status line could not load · see ~/.lcw/statusline.log&quot;.</title><style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans",Helvetica,Arial,sans-serif}.m{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;font-size:13px}.h1{font-size:20px;font-weight:700;letter-spacing:-0.01em}.h2{font-size:16px;font-weight:650}.b{font-size:13.5px}.s{font-size:12.5px}.bold{font-weight:650}.pg{fill:#fbf9f6}.ink{fill:#24211e}.mut{fill:#6b645c}.node{fill:#b5532f}.nodet{fill:#b5532f}.play{fill:#1f7a8c}.playt{fill:#1f7a8c}.axis{stroke:#d8cfc3;stroke-width:1;fill:none}.tbg{fill:#f6f3ec}.thl{stroke:#d6cfc2}.thls{stroke:#d6cfc2}.ttx{fill:#23221f}.tmid{fill:#55524c}.tmidf{fill:#55524c}.tdim{fill:#6f6b63}.k0{fill:#5fb46a}.s0{stroke:#5fb46a}.k1{fill:#55524c}.s1{stroke:#55524c}.k2{fill:#89847b}.s2{stroke:#89847b}.k3{fill:#d6cfc2}.s3{stroke:#d6cfc2}.k4{fill:#6a48c0}.s4{stroke:#6a48c0}.k5{fill:#6f6b63}.s5{stroke:#6f6b63}.k6{fill:#55524c}.s6{stroke:#55524c}.k7{fill:#23221f}.s7{stroke:#23221f}.k8{fill:#2f7d45}.s8{stroke:#2f7d45}.k9{fill:#23221f}.s9{stroke:#23221f}.k10{fill:#6d6961}.s10{stroke:#6d6961}.k11{fill:#b9382f}.s11{stroke:#b9382f}@media (prefers-color-scheme:dark){.pg{fill:#0d1117}.ink{fill:#e6edf3}.mut{fill:#9da7b1}.node{fill:#e8956f}.nodet{fill:#e8956f}.play{fill:#63bccb}.playt{fill:#63bccb}.axis{stroke:#3d444d;stroke-width:1;fill:none}.tbg{fill:#141312}.thl{stroke:#3a3732}.thls{stroke:#3a3732}.ttx{fill:#e9e6df}.tmid{fil