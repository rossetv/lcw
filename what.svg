<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 830 532" width="830" height="532" role="img" aria-labelledby="t d"><title id="t">Same tests, about 9× faster</title><desc id="d">The developer runs node --test &quot;tests/*/*.test.mjs&quot; as before and reads the same summary: 1248 tests, 1247 pass, 0 fail, 1 skipped, in 22850 ms. On the same machine the whole suite took 198.5 s with 1,276 tests before and takes 22.9 s with 1,248 tests now, about 9 times faster; the slowest file takes about 11 s. A failing test names the fact that broke, for example: the wave's ledger keeps that a resolution waits.</desc><style>
.pg{fill:#ffffff}.bx{fill:#ffffff;stroke:#d1d9e0}.bxc{fill:#f6f8fa;stroke:#d1d9e0}.new{fill:#ddf4ff;stroke:#0969da}.chg{fill:#ffffff;stroke:#0969da}
.pill{fill:#ffffff;stroke:#0969da}.ink{fill:#1f2328}.mut{fill:#59636e}.blue{fill:#0969da}.red{fill:#cf222e}
.ln{stroke:#6e7781}.ah{stroke:#6e7781}.lnf{stroke:#cf222e}.ahf{stroke:#cf222e}.failbx{fill:#ffffff;stroke:#cf222e}
.dot{fill:#1f2328}.dotf{fill:#cf222e}.hl{stroke:#1f2328}.hlf{stroke:#cf222e}.icon{stroke:#59636e}.bar0{fill:#d1d9e0}.grid{stroke:#d1d9e0}
@media (prefers-color-scheme:dark){
.pg{fill:#0d1117}.bx{fill:#0d1117;stroke:#3d444d}.bxc{fill:#151b23;stroke:#3d444d}.new{fill:#121d2f;stroke:#4493f8}.chg{fill:#0d1117;stroke:#4493f8}
.pill{fill:#0d1117;stroke:#4493f8}.ink{fill:#f0f6fc}.mut{fill:#9198a1}.blue{fill:#4493f8}.red{fill:#f85149}
.ln{stroke:#7d8590}.ah{stroke:#7d8590}.lnf{stroke:#f85149}.ahf{stroke:#f85149}.failbx{fill:#0d1117;stroke:#f85149}
.dot{fill:#f0f6fc}.dotf{fill:#f85149}.hl{stroke:#f0f6fc}.hlf{stroke:#f85149}.icon{stroke:#9198a1}.bar0{fill:#3d444d}.grid{stroke:#3d444d}}
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans",Helvetica,Arial,sans-serif}.m{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace}
rect{stroke-width:1}.ln,.lnf{fill:none;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}.lnf{stroke-dasharray:5 4}
.ah,.ahf{fill:none;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}.hl,.hlf{fill:none;stroke-width:1.5}
.dash{stroke-dasharray:5 4}
.g0,.g1{transform-box:fill-box;transform-origin:0 50%}.g0{animation:g0 12s linear infinite}@keyframes g0{0%{transform:scaleX(0)}75%,100%{transform:scaleX(1)}}.g1{animation:g1 12s linear infinite}@keyframes g1{0%{transform:scaleX(0)}8.7%,100%{transform:scaleX(1)}}.v1{animation:v1 12s linear infinite}@keyframes v1{0%,8.7%{opacity:0}10.7%,100%{opacity:1}}.v0{animation:v0 12s linear infinite}@keyframes v0{0%,75%{opacity:0}77%,100%{opacity:1}}.v2{animation:v2 12s linear infinite}@keyframes v2{0%,78%{opacity:0}81%,100%{opacity:1}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><rect class="pg" width="830" height="532" rx="12"/><text class="ink" x="20" y="38" font-size="20" font-weight="700" textLength="260.3">Same tests, about 9× faster</text><text class="mut" x="20" y="62" font-size="13.5" textLength="712">A developer types the same command and reads the same summary, in 23 seconds instead of over three minutes.</text><rect class="bxc" x="20.5" y="84.5" width="399" height="291" rx="10"/><circle class="bar0" cx="38" cy="100" r="5"/><circle class="bar0" cx="54" cy="100" r="5"/><circle class="bar0" cx="70" cy="100" r="5"/><path class="ln" style="stroke-width:1;opacity:.5" d="M21 116.5H419"/><text class="m ink" x="36" y="142" font-size="12.5" textLength="255.9">$ node --test &quot;tests/*/*.test.mjs&quot;</text><text class="m mut" x="36" y="164" font-size="12.5" textLength="5.1">⋮</text><text class="m ink" x="36" y="186" font-size="12.5" textLength="91">ℹ tests 1248</text><text class="m ink" x="36" y="208" font-size="12.5" textLength="83.5">ℹ pass 1247</text><text class="m ink" x="36" y="230" font-size="12.5" textLength="60.9">ℹ fail 0</text><text class="m ink" x="36" y="252" font-size="12.5" textLength="83.5">ℹ skipped 1</text><text class="m ink" x="36" y="274" font-size="12.5" textLength="143.7">ℹ duration_ms 22850</text><text class="m ink" x="36" y="296" font-size="12.5" textLength="7.5">$</text><rect class="dot" x="51.1" y="285" width="7.5" height="14" opacity=".7"/><rect class="bx" x="440.5" y="84.5" width="369" height="291" rx="10"/><text class="ink" x="456" y="110" font-size="14" font-weight="600" textLength="246.3">The whole suite, run on one machine</text><text class="ink" x="456" y="140" font-size="13" font-weight="600" textLength="41.8">Before</text><g class="v0"><text class="mut" x="794" y="140" font-size="13" text-anchor="end" textLength="120.2">198.5 s · 1,276 tests</text></g><rect class="bar0 g0" x="456" y="148" width="335.5" height="22" rx="3"/><text class="ink" x="456" y="196" font-size="13" font-weight="600" textLength="32">After</text><g class="v1"><text class="mut" x="794" y="196" font-size="13" text-anchor="end" textLength="114.7">22.9 s · 1,248 tests</text></g><rect class="new g1" x="456.5" y="204.5" width="37.7" height="21" rx="3"/><g class="v1"><rect class="pill" x="502.7" y="206" width="40.2" height="18" rx="9"/><text class="blue" x="522.8" y="219.2" font-size="12" font-weight="600" text-anchor="middle" textLength="24.2">new</text></g><path class="grid" d="M456 244.5H794"/><path class="grid" d="M456.5 244v5"/><text class="mut" x="456" y="264" font-size="12" textLength="7.6">0</text><path class="grid" d="M541 244v5"/><text class="mut" x="540.5" y="264" font-size="12" text-anchor="middle" textLength="15">50</text><path class="grid" d="M625.5 244v5"/><text class="mut" x="625" y="264" font-size="12" text-anchor="middle" textLength="20.7">100</text><path class="grid" d="M710 244v5"/><text class="mut" x="709.5" y="264" font-size="12" text-anchor="middle" textLength="20.5">150</text><path class="grid" d="M794.5 244v5"/><text class="mut" x="794" y="264" font-size="12" text-anchor="end" textLength="32">200 s</text><g class="v2"><text class="ink" x="456" y="296" font-size="17" font-weight="700" textLength="125.5">about 9× faster</text></g><text class="ink" x="456" y="322" font-size="13" textLength="180.1">Slowest single file: about 11 s.</text><text class="mut" x="456" y="342" font-size="12.5" textLength="272.5">It was one 2,445-line sweep file at about 150 s</text><text class="mut" x="456" y="360" font-size="12.5" textLength="239">alone; it is now 8 files, one for each area.</text><rect class="chg" x="20.5" y="400.5" width="789" height="111" rx="10"/><rect class="pill" x="729" y="391" width="67" height="18" rx="9"/><text class="blue" x="762.5" y="404.2" font-size="12" font-weight="600" text-anchor="middle" textLength="51">changed</text><text class="ink" x="36" y="426" font-size="14" font-weight="600" textLength="111.9">When a test fails</text><text class="ink" x="36" y="448" font-size="13" textLength="616">Its message names the fact that broke. A test of a refusal checks both: refused, and nothing changed.</text><rect class="bxc" x="36.5" y="462.5" width="757" height="33" rx="6"/><text class="m red" x="50" y="484" font-size="12.5" textLength="594.5">AssertionError [ERR_ASSERTION]: the wave's ledger keeps that a resolution waits</text></svg>
